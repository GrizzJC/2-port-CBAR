name: Inspect 3D models (development)
on:
  push:
    branches:
      - 'work/**'
    paths:
      - 'Rig-Engineering-Files/**'
      - 'inventory.csv'
      - 'tools/inspect_3d.py'
      - 'tools/test_inspect_3d.py'
      - 'tools/component_review.py'
      - 'tools/test_component_review.py'
      - '.github/workflows/inspect-3d.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect-models:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test geometry comparisons and component relationships
        run: python -m unittest discover -s tools -p 'test_*.py' -v
      - name: Inspect all registered manufacturing models
        env:
          ANALYSIS_BASE_REF: ${{ github.event.before }}
        run: python tools/inspect_3d.py --out .generated/3d-audit --compare 3DP-1-201 3DP-1-203
      - name: Show numerical results in GitHub Actions
        run: cat .generated/3d-audit/component-review.md >> "$GITHUB_STEP_SUMMARY"
      - name: Publish the actionable component review on the review branch
        if: github.ref == 'refs/heads/work/3d-print-review'
        run: |
          cp .generated/3d-audit/component-review.md Documentation/3D-COMPONENT-REVIEW.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Documentation/3D-COMPONENT-REVIEW.md
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate source-backed component review [skip ci]"
            git push origin HEAD:work/3d-print-review
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: 3d-file-audit
          path: .generated/3d-audit/
          retention-days: 30
